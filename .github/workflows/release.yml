name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"

          tag_exists() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/git/ref/tags/v$1")
            [ "$STATUS" = "200" ]
          }

          VERSION=$(node -p "require('./package.json').version")
          while tag_exists "$VERSION"; do
            VERSION=$(node -p "
              const [maj, min, pat] = '$VERSION'.split('.').map(Number);
              \`\${maj}.\${min}.\${pat + 1}\`
            ")
          done

          ORIGINAL=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$ORIGINAL" ]; then
            npm version "$VERSION" --no-git-tag-version

            # Fetch current SHA of package.json (required by Contents API)
            curl -s -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/contents/package.json" > /tmp/pkg_meta.json

            # Build the PUT payload via node to handle base64 + JSON safely
            node -e "
              const fs = require('fs');
              const sha  = JSON.parse(fs.readFileSync('/tmp/pkg_meta.json','utf8')).sha;
              const content = fs.readFileSync('package.json').toString('base64');
              fs.writeFileSync('/tmp/pkg_payload.json', JSON.stringify({
                message: 'chore: bump version to $VERSION [skip ci]',
                content,
                sha
              }));
            "

            curl -s -X PUT \
              -H "$AUTH" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$API/contents/package.json" \
              --data-binary @/tmp/pkg_payload.json
          fi

          echo "RELEASE_VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build release archive
        run: |
          mkdir -p dist/sap-api-mcp
          cp index.js package.json package-lock.json dist/sap-api-mcp/
          cp -r node_modules dist/sap-api-mcp/
          tar -czf sap-api-mcp.tar.gz -C dist sap-api-mcp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: sap-api-mcp.tar.gz
          generate_release_notes: true
