name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Bump patch until we find a tag that doesn't exist yet
          while gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; do
            VERSION=$(node -p "
              const [maj, min, pat] = '$VERSION'.split('.').map(Number);
              \`\${maj}.\${min}.\${pat + 1}\`
            ")
          done

          ORIGINAL=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$ORIGINAL" ]; then
            # Update package.json locally (used for the archive)
            npm version "$VERSION" --no-git-tag-version

            # Commit package.json back to main via GitHub Contents API
            PKG_CONTENT=$(base64 -w0 package.json)
            PKG_SHA=$(gh api "repos/${{ github.repository }}/contents/package.json" --jq '.sha')
            gh api "repos/${{ github.repository }}/contents/package.json" \
              --method PUT \
              --field message="chore: bump version to $VERSION [skip ci]" \
              --field content="$PKG_CONTENT" \
              --field sha="$PKG_SHA"
          fi

          echo "RELEASE_VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build release archive
        run: |
          mkdir -p dist/sap-api-mcp
          cp index.js package.json package-lock.json dist/sap-api-mcp/
          cp -r node_modules dist/sap-api-mcp/
          tar -czf sap-api-mcp.tar.gz -C dist sap-api-mcp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: sap-api-mcp.tar.gz
          generate_release_notes: true
