name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump patch version if tag already exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          while git rev-parse "v$VERSION" >/dev/null 2>&1; do
            VERSION=$(node -p "
              const [maj, min, pat] = '$VERSION'.split('.').map(Number);
              \`\${maj}.\${min}.\${pat + 1}\`
            ")
          done
          if [ "$VERSION" != "$(node -p "require('./package.json').version")" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version "$VERSION" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: bump patch version to $VERSION [skip ci]"
            git push origin main
          fi
          echo "RELEASE_VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build release archive
        run: |
          mkdir -p dist/sap-api-mcp
          cp index.js package.json package-lock.json dist/sap-api-mcp/
          cp -r node_modules dist/sap-api-mcp/
          tar -czf sap-api-mcp.tar.gz -C dist sap-api-mcp

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: sap-api-mcp.tar.gz
          generate_release_notes: true
